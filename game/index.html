<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summit Rush — downhill slope racer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e2233; }
  #game { position: fixed; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Summit Rush: steer a snowboarder down the mountain, tuck for speed, jump ramps, collect coins and dodge rocks and pines"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
